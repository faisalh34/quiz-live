<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كويز البث</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1226;color:#fff;font-family:system-ui,Tahoma,sans-serif;min-height:100vh;padding:16px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;font-size:18px;opacity:.9}
.card{background:#1b1f3b;border-radius:20px;padding:24px;text-align:center}
#q{font-size:clamp(26px,5vw,48px);font-weight:700;line-height:1.5;min-height:140px;display:flex;align-items:center;justify-content:center}
.bar{height:12px;background:#2b3060;border-radius:9px;overflow:hidden;margin-top:14px}#fill{height:100%;width:0;background:#ffcc33}
#info{font-size:24px;margin-top:14px;min-height:34px}
#win{font-size:clamp(28px,6vw,56px);color:#ffcc33;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:150px;overflow:hidden}
.chips span{background:#2b3060;padding:6px 14px;border-radius:20px;font-size:16px}
#ctl{display:none;gap:8px;justify-content:center;flex-wrap:wrap}button{font:inherit;padding:10px 20px;border:0;border-radius:12px;background:#ffcc33;color:#111;font-weight:700}
</style>
<div class="top"><span id="st">…</span><span id="cnt"></span></div>
<div class="card"><div id="q"></div><div class="bar"><div id="fill"></div></div><div id="info"></div><div id="win"></div></div>
<div class="card"><div style="margin-bottom:10px">المشاركون — اكتب «تم» في الشات</div><div class="chips" id="pl"></div></div>
<div id="ctl"><button data-c="start">ابدأ</button><button data-c="skip">تخطي</button><button data-c="stop">إيقاف</button><button data-c="clear">مسح القائمة</button></div>
<script>
const $=i=>document.getElementById(i),P=new URLSearchParams(location.search),key=P.get('key')||'';
if(P.has('key'))$('ctl').style.display='flex';
let ws,end=0,total=25,shuf;
document.querySelectorAll('button').forEach(b=>b.onclick=()=>ws.send(JSON.stringify({cmd:b.dataset.c,key})));
function conn(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onclose=()=>setTimeout(conn,2000);ws.onmessage=e=>draw(JSON.parse(e.data))}
function draw(s){clearInterval(shuf);end=Date.now()+s.left;total=s.total;
$('st').textContent=s.conn==='connected'?'🟢 متصل بالبث':'🔴 بانتظار فتح البث…';
$('cnt').textContent='إجابات صحيحة: '+s.correctNames.length;
$('win').textContent='';$('info').textContent='';
$('q').textContent=s.phase==='idle'?'الكويز جاهز… اكتب «تم» للمشاركة!':s.q;
if(s.phase==='draw'){$('info').textContent='🎲 جاري السحب…';if(s.correctNames.length)shuf=setInterval(()=>$('win').textContent=s.correctNames[Math.random()*s.correctNames.length|0],90)}
if(s.phase==='result'){$('info').textContent='الإجابة: '+s.answer;$('win').textContent=s.winner?'🎉 '+s.winner:'ما أحد جاوب صح 😅'}
$('pl').replaceChildren(...s.players.slice(-40).map(n=>Object.assign(document.createElement('span'),{textContent:n})))}
setInterval(()=>{const l=Math.max(0,end-Date.now());$('fill').style.width=(l&&total?l/total/10:0)+'%'},100);
conn();
</script></html>
